<style>
  :root{
    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body:'Work Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    --brand-forest:#1f5c46;
    --brand-green:#2f7159;
    --brand-green-dark:#204c3b;
    --brand-mint:#eaf6f1;
    --brand-mint-deep:#d3ecdf;
    --brand-cream:#faf6ef;
    --brand-cream-deep:#f1ead9;
    --brand-gold:#c98a3e;

    --ink:#1f2a24;
    --ink-soft:#54645a;
    --ink-faint:#8b988e;
    --line:#e4ddcd;
    --surface:#fffdf9;

    --pendente-bg:#fdf1d2; --pendente-text:#8a5a12; --pendente-border:#f0c869;
    --aprovado-bg:#dcefe3; --aprovado-text:#1f5c46; --aprovado-border:#a4d3b8;
    --recusado-bg:#fae3dd; --recusado-text:#96341f; --recusado-border:#eeb3a3;
    --alteracao-bg:#e4eef6; --alteracao-text:#2c5170; --alteracao-border:#b7d2e6;

    --shadow-sm:0 1px 2px rgba(31,42,36,.08);
    --shadow-md:0 10px 28px rgba(31,42,36,.12);
    --radius-sm:8px; --radius-md:12px; --radius-lg:20px;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0; font-family:var(--font-body); background:var(--brand-cream); color:var(--ink); -webkit-font-smoothing:antialiased;}
  .wrap{max-width:1120px; margin:0 auto; padding:0 16px 60px;}

  header{display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between; margin:0 -16px 20px; padding:20px 16px 22px;
    background:linear-gradient(155deg, var(--brand-forest) 0%, var(--brand-green) 62%, var(--brand-green-dark) 100%);
    color:#fff; border-radius:0 0 var(--radius-lg) var(--radius-lg); box-shadow:var(--shadow-md);}
  header h1{font-family:var(--font-display); font-weight:700; font-size:22px; margin:0 0 3px; letter-spacing:.2px; text-wrap:balance;}
  header .muted{color:rgba(255,255,255,.82);}
  .header-brand{display:flex; align-items:center; gap:14px;}
  .header-brand img{height:52px; width:auto; flex-shrink:0; background:#fff; border-radius:12px; padding:4px; box-shadow:var(--shadow-sm);}
  .header-actions{display:flex; flex-wrap:wrap; align-items:center; gap:8px; position:relative;}

  .muted{color:var(--ink-faint); font-size:13px; margin:0;}

  .btn{border:1px solid var(--line); background:var(--surface); border-radius:var(--radius-sm); padding:9px 14px; font-size:13px; font-weight:500; cursor:pointer; color:var(--ink-soft); font-family:inherit; transition:background .15s ease, border-color .15s ease, transform .1s ease;}
  .btn:hover{background:var(--brand-mint); border-color:var(--brand-mint-deep);}
  .btn:active{transform:translateY(1px);}
  .btn-icon{padding:9px 12px;}
  .btn-primary{background:var(--brand-green); border-color:var(--brand-green); color:#fff; box-shadow:var(--shadow-sm);}
  .btn-primary:hover{background:var(--brand-green-dark);}
  .btn-dark{background:var(--ink); border-color:var(--ink); color:#fff;}
  .btn-dark:hover{background:#3a463f;}
  .btn-approve{background:#2f8f5f; border-color:#2f8f5f; color:#fff;}
  .btn-approve:hover{background:#25764c;}
  .btn-reject{background:#c1503a; border-color:#c1503a; color:#fff;}
  .btn-reject:hover{background:#a33f2c;}
  .btn-changes{background:#3d76a8; border-color:#3d76a8; color:#fff;}
  .btn-changes:hover{background:#305d86;}
  .btn-block{width:100%;}
  header .btn{background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.38); color:#fff;}
  header .btn:hover{background:rgba(255,255,255,.24);}
  .icon-btn{border:1px solid var(--line); background:var(--surface); border-radius:var(--radius-sm); padding:9px 12px; cursor:pointer; position:relative; font-size:15px;}
  header .icon-btn{background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.38); color:#fff;}
  header .icon-btn:hover{background:rgba(255,255,255,.24);}
  .badge{position:absolute; top:-6px; right:-6px; background:var(--brand-gold); color:#fff; font-size:10px; border-radius:999px; padding:1px 5px; font-weight:700;}

  .google-status-off{background:var(--pendente-bg); color:var(--pendente-text); border-color:var(--pendente-border);}

  @media (max-width: 720px){
    .wrap{padding:0 12px 90px;}

    .center-card, .center-card.wide{margin:20px auto;}
  }
</style>
</head>

  var bookings = [];            // agenda pública (campos não sensíveis), recarregada do Supabase

  // ---------- Helpers de data ----------
  function pad(n){ return String(n).padStart(2,'0'); }
  function toLocalValue(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); }
  function parseLocal(v){
    if(!v) return new Date(NaN);
    var parts = v.split('T');
    var dateParts = parts[0].split('-').map(Number);
    var timeParts = (parts[1]||'00:00').split(':').map(Number);
    return new Date(dateParts[0], dateParts[1]-1, dateParts[2], timeParts[0]||0, timeParts[1]||0);
  }
  function startOfDay(d){ var r=new Date(d); r.setHours(0,0,0,0); return r; }
  function endOfDay(d){ var r=new Date(d); r.setHours(23,59,59,999); return r; }
  function addDays(d,n){ var r=new Date(d); r.setDate(r.getDate()+n); return r; }
  function startOfWeek(d){ var r=startOfDay(d); r.setDate(r.getDate()-r.getDay()); return r; }
  function endOfWeek(d){ var r=startOfWeek(d); r.setDate(r.getDate()+6); r.setHours(23,59,59,999); return r; }
  function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
  function endOfMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0, 23,59,59,999); }
  function isSameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function isToday(d){ return isSameDay(d, new Date()); }
  function fmtHM(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
  function fmtDateTime(d){ return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' às '+fmtHM(d); }
  function eachDay(from,to){
    var days=[]; var d=startOfDay(from); var end=startOfDay(to);
    while(d<=end){ days.push(new Date(d)); d=addDays(d,1); }
    return days;
  }
  function getRange(mode, anchor){
    if(mode==='dia') return {from:startOfDay(anchor), to:endOfDay(anchor)};
    if(mode==='semana') return {from:startOfWeek(anchor), to:endOfWeek(anchor)};
    var ms=startOfMonth(anchor), me=endOfMonth(anchor);
    return {from:startOfWeek(ms), to:endOfWeek(me)};
  }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function uid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-'+Math.random().toString(36).slice(2)+Date.now();
  }

  // ---------- Supabase (API REST + funções RPC) ----------
  function sbHeaders(extra){
    var h = {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': 'application/json'
    };
    if(extra) for(var k in extra) h[k]=extra[k];
    return h;
  }
  async function sbErrorFromResponse(res){
    var msg = 'Erro ao comunicar com o banco de dados (HTTP '+res.status+').';
    try{
      var j = await res.json();
      if(j && j.message) msg = j.message;
    }catch(e){}
    var err = new Error(msg);
    err.status = res.status;
    return err;
  }
  async function sbSelect(path){
    var res = await fetch(REST + path, { headers: sbHeaders() });
    if(!res.ok) throw await sbErrorFromResponse(res);
    return res.json();
  }
  async function sbInsert(table, row){
    var res = await fetch(REST + '/' + table, {
      method:'POST', headers: sbHeaders({'Prefer':'return=minimal'}), body: JSON.stringify(row)
    });
    if(!res.ok) throw await sbErrorFromResponse(res);
  }
  async function sbRpc(name, args){
    var res = await fetch(REST + '/rpc/' + name, {
      method:'POST', headers: sbHeaders(), body: JSON.stringify(args||{})
    });
    if(!res.ok) throw await sbErrorFromResponse(res);
    var text = await res.text();
    return text ? JSON.parse(text) : null;
  }

  // Converte uma linha do Postgres (snake_case) para o formato usado pelo
  // resto deste arquivo (camelCase) — assim todas as funções de
  // renderização abaixo ficam exatamente iguais às da versão offline.
  function normalizeBooking(row){
    if(!row) return row;
    return {
      id: row.id, roomId: row.room_id,
      requesterEmail: row.requester_email, requesterName: row.requester_name, requesterPhone: row.requester_phone,
      startTime: row.start_time, endTime: row.end_time, subject: row.subject, reason: row.reason,
      urgency: row.urgency, coffee: row.coffee, notes: row.notes, status: row.status,
      adminMessage: row.admin_message, accessToken: row.access_token,
      googleEventLink: row.google_event_link || '', googleEventId: row.google_event_id || '',
      createdAt: row.created_at, updatedAt: row.updated_at
    };
  }
  function normalizeBookings(rows){ return (rows||[]).map(normalizeBooking); }

  function getAdminCreds(){
    try{ return JSON.parse(sessionStorage.getItem(ADMIN_CREDS_KEY)); }catch(e){ return null; }
  }
  function setAdminCreds(email, password){
    sessionStorage.setItem(ADMIN_CREDS_KEY, JSON.stringify({email:email, password:password}));
  }
  function clearAdminCreds(){ sessionStorage.removeItem(ADMIN_CREDS_KEY); }

  async function refreshBookings(){
    var rows = await sbSelect('/bookings_public?select=*&order=start_time.asc');
    bookings = normalizeBookings(rows);
  }
  async function loadAdminBookings(){
    var creds = getAdminCreds();
    if(!creds){ adminBookingsCache = []; return; }
    var rows = await sbRpc('admin_list_bookings', {p_email:creds.email, p_password:creds.password});
    adminBookingsCache = normalizeBookings(rows);
  }

  // ---------- Histórico de avisos (sino 🔔) ----------
  // Isto é só um registro local, neste navegador, do que já foi avisado —
  // não é o envio em si. O envio de e-mail de verdade acontece à parte,
  // pela Edge Function "send-email" (ver sendRealEmail() logo abaixo); o
  // WhatsApp continua sendo sempre um link manual (não existe envio
  // automático de WhatsApp sem a API oficial paga do WhatsApp Business).
  function loadNotices(){ try{ return JSON.parse(localStorage.getItem(NOTICE_KEY)) || []; }catch(e){ return []; } }
  function saveNotices(){ localStorage.setItem(NOTICE_KEY, JSON.stringify(notices.slice(-50))); }
  function addNotice(to, subject, body, phone){
    notices.push({to:to, subject:subject, body:body||'', phone:phone||'', at:new Date().toISOString()});
    saveNotices();
  }
  // Chama a Edge Function que manda o e-mail de verdade pelo Resend (ver
  // supabase/functions/send-email/index.ts). O navegador só informa QUAL
  // evento aconteceu e sua prova de autorização (access_token de quem
  // acabou de criar a solicitação, ou a senha do administrador) — quem
  // decide o destinatário e o texto do e-mail é sempre a função, a partir
  // do que está de verdade no banco, nunca do que o navegador manda.
  // Retorna true/false e nunca lança erro — se a função ainda não foi
  // publicada, ou o Resend não está configurado, o site continua
  // funcionando normalmente, só sem esse envio (fica registrado no
  // console do navegador, F12, para diagnóstico).
  async function sendRealEmail(payload){
    try{
      var res = await fetch(SEND_EMAIL_URL, { method:'POST', headers: sbHeaders(), body: JSON.stringify(payload) });
      if(!res.ok){
        var errBody = await res.json().catch(function(){ return {}; });
        throw new Error(errBody.error || ('Erro '+res.status));
      }
      return true;
    }catch(e){
      console.warn('Não foi possível enviar e-mail real:', e.message);
      return false;
    }
  }
  function renderNoticesList(){
    var list = document.getElementById('noticesList');
    if(!list) return;
    if(!notices.length){ list.innerHTML = '<p class="muted">Nenhuma notificação ainda.</p>'; return; }
    var items = notices.slice().reverse().slice(0,20).map(function(n){
      var d = new Date(n.at);
      var wa = n.phone ? '<div class="notice-item-actions"><a class="whatsapp-link" target="_blank" rel="noreferrer" href="'+buildWhatsAppUrl(n.phone, n.subject+(n.body?(' — '+n.body):''))+'">📱 Enviar este aviso por WhatsApp</a></div>' : '';
      return '<div class="notice-item"><div><b>'+escapeHtml(n.subject)+'</b></div>'+
        '<div class="notice-to">para '+escapeHtml(n.to)+' · '+fmtDateTime(d)+'</div>'+wa+'</div>';
    }).join('');
    list.innerHTML = items;
  }

  // ---------- Toast ----------
  function toast(msg, type){
    var container = document.getElementById('toastContainer');
    var div = document.createElement('div');
    div.className = 'toast' + (type ? ' toast-'+type : '');
    div.textContent = msg;
    container.appendChild(div);
    setTimeout(function(){
      div.classList.add('fade');
      setTimeout(function(){ div.remove(); }, 300);
    }, 3200);
  }

  // ---------- Validação ----------
  function validateBooking(data){
    var errors = {};
    if(!data.requesterEmail || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.requesterEmail)) errors.requesterEmail='Informe um e-mail válido.';
    if(!data.requesterName || data.requesterName.trim().length<2) errors.requesterName='Informe seu nome completo.';
    if(!data.requesterPhone || data.requesterPhone.replace(/\D/g,'').length<10) errors.requesterPhone='Informe um celular válido com DDD.';
    if(!data.startTime) errors.startTime='Informe o horário de início.';
    if(!data.endTime) errors.endTime='Informe o horário de término.';
    if(data.startTime && data.endTime && !errors.startTime && !errors.endTime && parseLocal(data.endTime) <= parseLocal(data.startTime)) errors.endTime='O horário de término deve ser depois do início.';
    if(!data.subject || data.subject.trim().length<2) errors.subject='Informe o tema da reunião.';
    if(!data.reason || data.reason.trim().length<2) errors.reason='Informe o motivo da reunião.';
    return errors;
  }
  function hasApprovedOverlap(startTime, endTime, excludeId){
    // Checagem rápida usando os dados já carregados na agenda pública, só
    // para avisar educadamente antes de enviar — a aprovação de cada
    // solicitação continua sendo manual (um administrador decide), e é
    // nesse momento que um conflito real seria percebido, igual à versão
    // com backend Next.js.
    var s = parseLocal(startTime), e = parseLocal(endTime);
    return bookings.some(function(b){
      return b.id!==excludeId && b.status==='aprovado' && parseLocal(b.startTime) < e && parseLocal(b.endTime) > s;
    });
  }

  // ---------- WhatsApp ----------
  // Gera um link "wa.me" que abre o WhatsApp (Web ou app) já com a
  // mensagem pronta — a pessoa só precisa clicar em enviar. Não existe
  // envio automático/silencioso de WhatsApp a partir de uma página estática
  // (isso exigiria a API oficial do WhatsApp Business e um servidor).
  function buildWhatsAppUrl(phone, message){
    var digits = String(phone||'').replace(/\D/g,'');
    if(!digits) return null;
    if(digits.length <= 11) digits = '55' + digits; // assume DDD do Brasil sem código do país
    return 'https://wa.me/' + digits + '?text=' + encodeURIComponent(message);
  }
  function statusMessageForWhatsApp(b){
    var quando = fmtDateTime(parseLocal(b.startTime));
    if(b.status==='pendente') return 'Olá, '+b.requesterName+'! Recebemos sua solicitação de reunião "'+b.subject+'" para '+quando+'. Em breve retornamos com a aprovação.';
    if(b.status==='aprovado') return 'Olá, '+b.requesterName+'! Sua reunião "'+b.subject+'" foi APROVADA para '+quando+'. Qualquer coisa, é só chamar.';
    if(b.status==='recusado') return 'Olá, '+b.requesterName+'. Sua solicitação de reunião "'+b.subject+'" não pôde ser aprovada.'+(b.adminMessage?(' Motivo: '+b.adminMessage):'');

  }

  function buildIcs(b){

    return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Paulus Restaurantes//Agenda Sala//PT','CALSCALE:GREGORIAN','METHOD:PUBLISH',
      'BEGIN:VEVENT','UID:'+b.id+'@paulusrestaurantes','DTSTAMP:'+fmt(new Date()),'DTSTART:'+fmt(start),'DTEND:'+fmt(end),
      'SUMMARY:'+esc(b.subject),'DESCRIPTION:'+esc(b.reason+' - Solicitado por '+b.requesterName),'LOCATION:'+COMPANY_NAME,'STATUS:CONFIRMED',
      'END:VEVENT','END:VCALENDAR'].join('\r\n');

  function downloadIcs(b){

  // ---------- Google Agenda: integração automática (opcional) ----------
  // Só entra em ação se GOOGLE_CLIENT_ID (lá em cima) estiver preenchido.
  // Usa o "OAuth de token" do Google (Google Identity Services), pensado
  // exatamente para apps que rodam só no navegador, sem servidor: o
  // administrador autoriza uma vez por sessão, o navegador recebe um
  // token de acesso temporário (~1h, guardado só no sessionStorage deste
  // navegador) e usa esse token para criar o evento direto pela API do
  // Google quando uma reunião é aprovada.
  function googleEnabled(){ return !!GOOGLE_CLIENT_ID; }
  function getGoogleToken(){
    try{
      var raw = sessionStorage.getItem(GOOGLE_TOKEN_KEY);
      if(!raw) return null;
      var data = JSON.parse(raw);
      if(!data.token || !data.expiresAt || Date.now() > data.expiresAt - 30000) return null;
      return data.token;
    }catch(e){ return null; }
  }
  function setGoogleToken(token, expiresInSec){
    try{ sessionStorage.setItem(GOOGLE_TOKEN_KEY, JSON.stringify({token:token, expiresAt: Date.now() + (expiresInSec||3500)*1000})); }catch(e){}
  }
  function clearGoogleToken(){ try{ sessionStorage.removeItem(GOOGLE_TOKEN_KEY); }catch(e){} }
  // Pede um token ao Google. promptMode 'consent' mostra a tela de login
  // (usada no botão "Conectar"); promptMode '' tenta em silêncio, sem
  // interromper o administrador (usada antes de criar um evento).
  function requestGoogleToken(promptMode){
    return new Promise(function(resolve){
      if(!googleEnabled() || typeof google==='undefined' || !google.accounts || !google.accounts.oauth2){ resolve(null); return; }
      try{
        var client = google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_CLIENT_ID,
          scope: GOOGLE_SCOPES,
          callback: function(resp){
            if(resp && resp.access_token){ setGoogleToken(resp.access_token, resp.expires_in); resolve(resp.access_token); }
            else resolve(null);
          },
          error_callback: function(){ resolve(null); }
        });
        client.requestAccessToken({prompt: promptMode});
      }catch(e){ resolve(null); }
    });
  }
  async function ensureGoogleToken(){
    var token = getGoogleToken();
    if(token) return token;
    if(!googleEnabled()) return null;
    return await requestGoogleToken('');
  }
  async function connectGoogleCalendar(){
    if(!googleEnabled()){ toast('Integração com Google Agenda não configurada neste site.', 'error'); return; }
    var token = await requestGoogleToken('consent');
    toast(token ? 'Google Agenda conectada.' : 'Não foi possível conectar à Google Agenda.', token ? 'success' : 'error');
    renderView();
  }
  function disconnectGoogleCalendar(){
    var token = getGoogleToken();
    clearGoogleToken();
    if(token && typeof google!=='undefined' && google.accounts && google.accounts.oauth2){
      try{ google.accounts.oauth2.revoke(token, function(){}); }catch(e){}
    }
    toast('Google Agenda desconectada.', 'success');
    renderView();
  }
  function toRfc3339Local(d){
    function p(n){ return String(n).padStart(2,'0'); }
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())+':00';
  }
  function buildGoogleEventResource(b){
    var start = parseLocal(b.startTime), end = parseLocal(b.endTime);
    var description = 'Solicitado por: ' + b.requesterName +
      (b.requesterPhone ? ('\nCelular: ' + b.requesterPhone) : '') +
      (b.requesterEmail ? ('\nE-mail: ' + b.requesterEmail) : '') +
      (b.reason ? ('\nMotivo: ' + b.reason) : '') +
      (b.notes ? ('\nObservações: ' + b.notes) : '');
    return {
      summary: b.subject,
      location: COMPANY_NAME + ' — Sala de Reunião',
      description: description,
      start: { dateTime: toRfc3339Local(start), timeZone: 'America/Sao_Paulo' },
      end: { dateTime: toRfc3339Local(end), timeZone: 'America/Sao_Paulo' }
    };
  }
  // Cria o evento direto na agenda compartilhada. Retorna o link do evento
  // criado (para guardar na reserva e mostrar no painel) ou null se a
  // integração não estiver conectada — nesse caso o administrador ainda
  // tem o botão manual "Adicionar à Agenda do Google" no card.
  async function createGoogleCalendarEvent(b){
    var token = await ensureGoogleToken();
    if(!token) return null;
    var res = await fetch('https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(GOOGLE_CALENDAR_ID)+'/events', {
      method:'POST',
      headers:{'Authorization':'Bearer '+token, 'Content-Type':'application/json'},
      body: JSON.stringify(buildGoogleEventResource(b))
    });
    if(!res.ok){
      if(res.status===401) clearGoogleToken();
      var errBody = await res.json().catch(function(){ return {}; });
      throw new Error((errBody.error && errBody.error.message) || ('Erro '+res.status+' ao criar evento na Google Agenda.'));
    }
    var evt = await res.json();
    return { id: evt.id, link: evt.htmlLink || null };
  }
  // Atualiza um evento já existente (usada quando o administrador edita
  // uma reunião já aprovada e sincronizada). Lança erro se não conseguir —
  // quem chama decide se isso bloqueia o fluxo ou só avisa.
  async function updateGoogleCalendarEvent(eventId, b){
    var token = await ensureGoogleToken();
    if(!token) throw new Error('Google Agenda não conectada.');
    var res = await fetch('https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(GOOGLE_CALENDAR_ID)+'/events/'+encodeURIComponent(eventId), {
      method:'PATCH',
      headers:{'Authorization':'Bearer '+token, 'Content-Type':'application/json'},
      body: JSON.stringify(buildGoogleEventResource(b))
    });
    if(!res.ok){
      if(res.status===401) clearGoogleToken();
      var errBody = await res.json().catch(function(){ return {}; });
      throw new Error((errBody.error && errBody.error.message) || ('Erro '+res.status+' ao atualizar evento na Google Agenda.'));
    }
  }
  // Remove o evento (usada quando o administrador exclui uma reunião já
  // sincronizada). 410 significa que o evento já não existia mais — trata
  // como sucesso, não como erro.
  async function deleteGoogleCalendarEvent(eventId){
    var token = await ensureGoogleToken();
    if(!token) throw new Error('Google Agenda não conectada.');
    var res = await fetch('https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(GOOGLE_CALENDAR_ID)+'/events/'+encodeURIComponent(eventId), {
      method:'DELETE', headers:{'Authorization':'Bearer '+token}
    });
    if(!res.ok && res.status!==410){
      if(res.status===401) clearGoogleToken();
      throw new Error('Erro '+res.status+' ao remover evento da Google Agenda.');
    }
  }

  }

  // ---------- Grade de horários (dia/semana) ----------
  function buildDaySlots(day){
    var slots=[];
    var start = new Date(day); start.setHours(GRID_START,0,0,0);
    var totalMinutes = (GRID_END-GRID_START)*60;
    for(var m=0;m<totalMinutes;m+=SLOT_MIN){
      var s = new Date(start.getTime()+m*60000);
      var e = new Date(s.getTime()+SLOT_MIN*60000);
      slots.push({start:s,end:e});
    }
    return slots;
  }
  function visibleBookingsForRange(from,to){
    return bookings.filter(function(b){
      return (b.status==='pendente'||b.status==='aprovado') && parseLocal(b.startTime) < to && parseLocal(b.endTime) > from;
    });
  }
  function buildSegments(slots, dayBookings){
    var segments=[]; var i=0;
    function covers(slot,b){ return slot.start < parseLocal(b.endTime) && slot.end > parseLocal(b.startTime); }
    while(i<slots.length){
      var slot=slots[i];
      var covering = dayBookings.find(function(b){ return covers(slot,b); });
      if(!covering){ segments.push({type:'free', startIdx:i, endIdx:i+1, start:slot.start, end:slot.end}); i++; continue; }
      var j=i;
      while(j<slots.length && covers(slots[j], covering)) j++;
      segments.push({type:'booked', startIdx:i, endIdx:j, start:slots[i].start, end:slots[j-1].end, booking:covering});
      i=j;
    }
    return segments;
  }
  function renderTimeGrid(days){
    var totalSlots = ((GRID_END-GRID_START)*60)/SLOT_MIN;
    var slotH = 26;
    var gridH = totalSlots*slotH;
    var hourLabels='';
    for(var h=GRID_START; h<GRID_END; h++){
      var idx = ((h-GRID_START)*60)/SLOT_MIN;
      hourLabels += '<div class="hour-label" style="top:'+(idx*slotH-7)+'px">'+pad(h)+':00</div>';
    }
    var columns='';
    var now = new Date();
    days.forEach(function(day){
      var dayBookings = visibleBookingsForRange(startOfDay(day), endOfDay(day));
      var slots = buildDaySlots(day);
      var segs = buildSegments(slots, dayBookings);
      var segHtml='';
      segs.forEach(function(seg){
        var top = seg.startIdx*slotH, hgt=(seg.endIdx-seg.startIdx)*slotH;
        if(seg.type==='free'){
          var isPast = seg.end<=now;
          segHtml += '<button type="button" class="slot-free'+(isPast?' past':'')+'" '+(isPast?'disabled':'')+' style="top:'+top+'px;height:'+hgt+'px" data-action="new-booking" data-start="'+toLocalValue(seg.start)+'" data-end="'+toLocalValue(seg.end)+'"><span class="slot-hint">+ agendar</span></button>';
        } else {
          segHtml += '<button type="button" class="slot-booked status-'+seg.booking.status+'" style="top:'+top+'px;height:'+hgt+'px" title="'+escapeHtml(seg.booking.subject)+'" data-action="view-booking" data-id="'+seg.booking.id+'">'+
            '<div class="slot-booked-title">'+escapeHtml(seg.booking.subject)+'</div>'+
            '<div class="slot-booked-time">'+fmtHM(seg.start)+'–'+fmtHM(seg.end)+'</div></button>';
        }
      });
      columns += '<div class="day-col">'+
        '<div class="day-col-header'+(isToday(day)?' today':'')+'">'+WEEKDAYS_ABBR[day.getDay()]+' <b>'+pad(day.getDate())+'/'+pad(day.getMonth()+1)+'</b></div>'+
        '<div class="day-col-body" style="height:'+gridH+'px">'+segHtml+'</div></div>';
    });
    return '<div class="time-grid"><div class="gutter"><div class="gutter-header"></div><div class="gutter-body" style="height:'+gridH+'px">'+hourLabels+'</div></div>'+columns+'</div>';
  }

  function renderMonthGrid(days, anchor){
    var cells='';
    days.forEach(function(day){
      var dayBookings = bookings.filter(function(b){ return (b.status==='pendente'||b.status==='aprovado') && isSameDay(parseLocal(b.startTime), day); })
        .sort(function(a,b){ return a.startTime.localeCompare(b.startTime); });
      var visible = dayBookings.slice(0,3);
      var extra = dayBookings.length-visible.length;
      var inMonth = day.getMonth()===anchor.getMonth();
      var chips = visible.map(function(b){
        return '<button type="button" class="month-chip status-'+b.status+'" data-action="view-booking" data-id="'+b.id+'">'+fmtHM(parseLocal(b.startTime))+' '+escapeHtml(b.subject)+'</button>';
      }).join('');
      if(extra>0) chips += '<div class="month-extra">+'+extra+' mais</div>';
      cells += '<div class="month-cell'+(inMonth?'':' outside')+'" role="button" tabindex="0" data-action="goto-day" data-date="'+toLocalValue(day)+'">'+
        '<span class="month-daynum'+(isToday(day)?' today':'')+'">'+day.getDate()+'</span>'+
        '<div class="month-chips">'+chips+'</div></div>';
    });
    return '<div class="month-grid"><div class="month-weekdays">'+WEEKDAYS_ABBR.map(function(w){return '<div>'+w+'</div>';}).join('')+'</div>'+
      '<div class="month-cells">'+cells+'</div></div>';
  }

    var data = {

    };

    var safeEnd = data.endTime ? parseLocal(data.endTime) : drawerState.end;
    var errors = validateBooking(data);
    if(Object.keys(errors).length){
      document.getElementById('drawerBody').innerHTML = renderDrawerForm(safeStart, safeEnd, data, errors);
      return;
    }
    if(hasApprovedOverlap(data.startTime, data.endTime)){
      document.getElementById('drawerBody').innerHTML = renderDrawerForm(safeStart, safeEnd, data, {}, 'Este horário já está reservado e aprovado. Escolha outro horário.');
      return;
    }
    if(!defaultRoomId){
      document.getElementById('drawerBody').innerHTML = renderDrawerForm(safeStart, safeEnd, data, {}, 'Não foi possível identificar a sala no banco de dados. Atualize a página e tente de novo.');
      return;
    }
    var submitBtn = document.querySelector('#bookingForm button[type=submit]');
    if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'Enviando…'; }
    var accessToken = uid();
    try{
      await sbInsert('bookings', {
        room_id: defaultRoomId,
        requester_email: data.requesterEmail, requester_name: data.requesterName, requester_phone: data.requesterPhone,
        start_time: data.startTime, end_time: data.endTime, subject: data.subject, reason: data.reason,
        urgency: data.urgency, coffee: data.coffee, notes: data.notes,
        status: 'pendente', admin_message: '', access_token: accessToken
      });
    }catch(err){
      document.getElementById('drawerBody').innerHTML = renderDrawerForm(safeStart, safeEnd, data, {}, 'Não foi possível enviar sua solicitação: '+err.message);
      return;
    }
    addNotice('admin@paulusrestaurantes.com.br', 'Nova solicitação: '+data.subject, 'De '+data.requesterName+', '+fmtDateTime(parseLocal(data.startTime))+' até '+fmtHM(parseLocal(data.endTime)));
    addNotice(data.requesterEmail, 'Solicitação recebida: '+data.subject, 'Acompanhe pelo menu "Minhas solicitações" usando seu e-mail.', data.requesterPhone);
    sendRealEmail({kind:'nova_solicitacao', access_token: accessToken});
    document.getElementById('drawerBody').innerHTML =
      '<div class="success-box">Solicitação enviada! Você pode acompanhar o status a qualquer momento em "Minhas solicitações", usando o e-mail <b>'+escapeHtml(data.requesterEmail)+'</b>.</div>'+
      '<button class="btn btn-primary btn-block" data-action="close-drawer">Fechar</button>';
    try{ await refreshBookings(); }catch(e){ /* a agenda em tela fica desatualizada até a próxima atualização automática */ }
    renderView();
  }

  async function adminAction(id, status, message){

    var b = adminBookingsCache.find(function(x){ return x.id===id; });

    var finalMsg = toastMsg[status], finalKind = 'success';

      }
    }
    if(b){
      var emailOk = await sendRealEmail({kind:'status', booking_id:id, admin_email:creds.email, admin_password:creds.password});
      finalMsg += emailOk ? ' E-mail enviado ao solicitante.' : ' Não foi possível enviar o e-mail (verifique a função send-email no Supabase).';
    }
    toast(finalMsg, finalKind);

    var errors = validateBooking(Object.assign({}, data, {requesterEmail:b.requesterEmail}));
    if(Object.keys(errors).length){ toast('Verifique os campos destacados.', 'error'); return; }
    if(hasApprovedOverlap(data.startTime, data.endTime, id)){ toast('Esse novo horário já está aprovado para outra reunião.', 'error'); return; }
    try{
      await sbRpc('resubmit_booking', {
        p_booking_id:id, p_start_time:data.startTime, p_end_time:data.endTime,
        p_requester_name:data.requesterName, p_requester_phone:data.requesterPhone,
        p_subject:data.subject, p_reason:data.reason, p_notes:data.notes
      });
    }catch(err){
      toast('Não foi possível reenviar: '+err.message, 'error');
      return;
    }
    addNotice('admin@paulusrestaurantes.com.br', 'Solicitação reenviada: '+data.subject, '');
    if(b.accessToken) sendRealEmail({kind:'nova_solicitacao', access_token: b.accessToken});
    toast('Solicitação reenviada para aprovação!', 'success');
    await handleLookup(b.requesterEmail);
  }

  // ---------- Header / navegação de página ----------
  function renderHeader(){
    var header = document.getElementById('header');
    var right = '';
    if(uiState.page==='agenda'){
      right = '<button class="btn" data-action="goto-page" data-page="minhas">🗓️ Minhas solicitações</button>'+
        '<button class="btn" data-action="goto-page" data-page="admin">🛠️ Painel do administrador</button>';
    } else if(uiState.page==='admin'){
      right = '<button class="btn" data-action="goto-page" data-page="agenda">← Ver agenda</button>'+
        (uiState.adminLoggedIn ? '<button class="btn" data-action="admin-logout">🚪 Sair</button>' : '');
    } else {
      right = '<button class="btn" data-action="goto-page" data-page="agenda">← Ver agenda</button>';
    }
    header.innerHTML = '<div class="header-brand"><img src="'+LOGO_DATA_URI+'" alt="Paulu\'s Restaurantes Empresariais"><div><h1>Agenda da Sala de Reunião</h1><p class="muted">Clique em um horário livre para solicitar a sala.</p></div></div>'+
      '<div class="header-actions">'+right+
      '<button class="icon-btn" data-action="toggle-notices" title="Notificações (simulação)">🔔'+(notices.length?'<span class="badge">'+notices.length+'</span>':'')+'</button>'+
      '<div id="noticesPanel" class="notices-panel hidden"><h3>Notificações (simulação de e-mail)</h3><div id="noticesList"></div></div>'+
      '</div>';
  }

  async function navigate(delta){
    if(uiState.viewMode==='dia') uiState.anchor = addDays(uiState.anchor, delta);
    else if(uiState.viewMode==='semana') uiState.anchor = addDays(uiState.anchor, delta*7);
    else { var d = new Date(uiState.anchor); d.setMonth(d.getMonth()+delta); uiState.anchor = d; }
    renderView();
  }

  function renderView(){
    var el = document.getElementById('viewContainer');
    if(uiState.page==='admin') el.innerHTML = renderAdminPage();
    else if(uiState.page==='minhas') el.innerHTML = renderMinhasPage();
    else el.innerHTML = renderAgendaPage();
    renderHeader();
  }

  // ---------- Delegação de eventos ----------
  document.addEventListener('click', async function(e){
    var panel = document.getElementById('noticesPanel');
    var bellBtn = e.target.closest('[data-action="toggle-notices"]');
    if(panel && !panel.classList.contains('hidden') && !bellBtn && !panel.contains(e.target)){
      panel.classList.add('hidden');
    }
    var btn = e.target.closest('[data-action]');
    if(!btn) return;
    var action = btn.getAttribute('data-action');
    switch(action){
      case 'prev': navigate(-1); break;
      case 'next': navigate(1); break;
      case 'today': uiState.anchor = new Date(); renderView(); break;
      case 'set-view': uiState.viewMode = btn.getAttribute('data-mode'); renderView(); break;
      case 'new-booking': openDrawer(parseLocal(btn.getAttribute('data-start')), parseLocal(btn.getAttribute('data-end'))); break;
      case 'view-booking': await openBookingDetail(btn.getAttribute('data-id')); break;
      case 'close-drawer': closeDrawer(); break;
      case 'goto-day': uiState.anchor = parseLocal(btn.getAttribute('data-date')); uiState.viewMode='dia'; renderView(); break;
      case 'goto-page': {
        var page = btn.getAttribute('data-page');
        uiState.page = page;
        if(page==='admin' && uiState.adminLoggedIn){
          try{ await loadAdminBookings(); }
          catch(err){ uiState.adminLoggedIn=false; clearAdminCreds(); toast('Sessão expirada, faça login novamente.', 'error'); }
        }
        renderView();
        break;
      }
      case 'admin-filter': uiState.adminFilter = btn.getAttribute('data-filter'); renderView(); break;
      case 'admin-approve': await adminAction(btn.getAttribute('data-id'), 'aprovado'); break;
      case 'admin-open-msg': uiState.openMsgFor = {id:btn.getAttribute('data-id'), kind:btn.getAttribute('data-kind')}; renderView(); break;
      case 'admin-cancel-msg': uiState.openMsgFor = null; renderView(); break;
      case 'admin-confirm-msg': {
        var id = btn.getAttribute('data-id');
        var ta = document.querySelector('textarea[data-msg-id="'+id+'"]');
        var msg = ta ? ta.value.trim() : '';
        if(!msg){ toast('Escreva uma mensagem explicando o motivo.', 'error'); return; }
        var kind = btn.getAttribute('data-kind');
        await adminAction(id, kind==='reject' ? 'recusado' : 'alteracao_solicitada', msg);
        break;
      }
      case 'admin-logout': uiState.adminLoggedIn=false; clearAdminCreds(); adminBookingsCache=[]; uiState.page='agenda'; renderView(); break;
      case 'admin-edit': openAdminEdit(btn.getAttribute('data-id')); break;
      case 'admin-delete-open': uiState.confirmDeleteFor = btn.getAttribute('data-id'); renderView(); break;
      case 'admin-delete-cancel': uiState.confirmDeleteFor = null; renderView(); break;
      case 'admin-delete-confirm': await adminDeleteBooking(btn.getAttribute('data-id')); break;
      case 'google-connect': await connectGoogleCalendar(); break;
      case 'google-disconnect': disconnectGoogleCalendar(); break;
      case 'download-ics': downloadIcs(myBookingsCache.find(function(b){ return b.id===btn.getAttribute('data-id'); })); break;
      case 'toggle-notices': {
        var p = document.getElementById('noticesPanel');
        if(p){ p.classList.toggle('hidden'); if(!p.classList.contains('hidden')) renderNoticesList(); }
        break;
      }
    }
  });

  document.addEventListener('submit', async function(e){
    if(e.target && e.target.id==='bookingForm'){ e.preventDefault(); await handleBookingSubmit(e.target); }
    else if(e.target && e.target.id==='adminLoginForm'){ e.preventDefault(); await handleAdminLogin(e.target); }
    else if(e.target && e.target.id==='lookupForm'){ e.preventDefault(); await handleLookup(e.target.email.value.trim()); }
    else if(e.target && e.target.id==='changePassForm'){ e.preventDefault(); await handleChangePassword(e.target); }
    else if(e.target && e.target.id==='cleanupForm'){ e.preventDefault(); await handleCleanup(e.target); }
    else if(e.target && e.target.classList && e.target.classList.contains('resubmit-form')){ e.preventDefault(); await handleResubmit(e.target); }
    else if(e.target && e.target.classList && e.target.classList.contains('admin-edit-form')){ e.preventDefault(); await handleAdminEdit(e.target); }
  });

  document.getElementById('overlay').addEventListener('click', closeDrawer);

  // .month-cell não é um <button> nativo (para não aninhar botões dentro
  // dele, já que cada reunião do dia também é clicável) — então replicamos
  // a ativação por teclado (Enter/Espaço) manualmente.
  document.addEventListener('keydown', function(e){
    if(e.key!=='Enter' && e.key!==' ') return;
    var cell = e.target.closest('.month-cell');
    if(cell && e.target===cell){ e.preventDefault(); cell.click(); }
  });

  // Atualiza a agenda sozinha de tempos em tempos, para mostrar reservas
  // feitas por outras pessoas sem precisar recarregar a página (só
  // enquanto a aba "agenda" está aberta e nenhum painel está aberto, para
  // não atrapalhar quem está no meio de um formulário).
  function startPolling(){
    setInterval(async function(){
      if(uiState.page!=='agenda') return;
      if(document.getElementById('drawer').classList.contains('open')) return;
      try{
        await refreshBookings();
        renderView();
      }catch(e){ /* tenta de novo no próximo ciclo */ }
    }, 45000);
  }

  // ---------- Inicialização ----------
  async function init(){
    renderHeader();
    document.getElementById('viewContainer').innerHTML = '<div class="center-card"><p class="muted">Carregando agenda…</p></div>';
    notices = loadNotices();
    uiState.adminLoggedIn = !!getAdminCreds();
    if(window.matchMedia && window.matchMedia('(max-width: 720px)').matches){
      uiState.viewMode = 'dia';
    }
    try{
      var rooms = await sbSelect('/rooms?select=id&limit=1');
      defaultRoomId = rooms[0] && rooms[0].id;
      await refreshBookings();
      if(uiState.adminLoggedIn){
        try{ await loadAdminBookings(); }
        catch(e){ uiState.adminLoggedIn=false; clearAdminCreds(); }
      }
      renderHeader();
      renderView();
      startPolling();
    }catch(err){
      document.getElementById('viewContainer').innerHTML =
        '<div class="center-card"><div class="global-error">Não foi possível conectar ao banco de dados do Supabase. Verifique sua internet e tente atualizar a página. Se o problema continuar, confirme se o arquivo supabase/browser_access.sql já foi rodado no SQL Editor do Supabase. Detalhe técnico: '+escapeHtml(err.message)+'</div></div>';
    }
  }
  init();
})();
</script>
</body>
</html>
